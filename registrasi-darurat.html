<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registrasi Pasien Darurat — Care IGD Clinical Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            med: {
              DEFAULT: '#006a4e',
              dark: '#00563f',
              light: '#e6f4f0',
              emerald: '#047857',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body data-page="reg-darurat">
  <!-- Root Container: Halaman Registrasi Pasien Darurat -->
  <div id="appRoot">
    <div class="app-shell">
      <aside class="sidebar">
        <div>
          <div class="flex items-center gap-3.5 px-2 mb-9 cursor-pointer" onclick="navigate('dashboard')">
            <div class="w-11 h-11 rounded-2xl bg-[#006a4e] flex items-center justify-center shadow-sm">+</div>
            <div>
              <div class="text-[18px] font-bold text-slate-900 leading-none tracking-tight">Care IGD</div>
              <div class="text-[10px] font-bold text-slate-400 tracking-[0.1em] uppercase mt-1">CLINICAL SUITE</div>
            </div>
          </div>

          <nav class="flex flex-col gap-2 nav-list-mobile">
            <button class="nav-btn" onclick="navigate('dashboard')"><span>Dashboard</span></button>
            <button class="nav-btn active" onclick="navigate('pasien-igd')"><span>Pasien IGD</span></button>
            <button class="nav-btn" onclick="navigate('pemesanan')"><span>Pemesanan</span></button>
            <button class="nav-btn" onclick="navigate('lab-lis')"><span>Lab LIS</span></button>
          </nav>
        </div>

        <div class="pt-4 border-t border-slate-100">
          <button onclick="doLogout()" class="w-full py-2.5 px-3.5 rounded-xl text-slate-500 hover:text-rose-600 text-xs font-semibold flex items-center gap-3">
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <main class="main-area">
        <header class="topbar">
          <div></div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <div class="text-sm font-bold text-slate-900 leading-tight">Ns. Siti Rahma, S.Kep</div>
              <div class="text-xs font-medium text-slate-400">Perawat Triage</div>
            </div>
            <div class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-bold bg-[#0b5340] text-white">SR</div>
          </div>
        </header>

        <div class="page-body">
          <div class="mb-6">
            <h2 class="text-xl font-extrabold text-slate-900 tracking-tight">Registrasi Pasien Darurat</h2>
            <p class="text-xs text-slate-400 mt-0.5">Pencatatan data darurat cepat &amp; alokasi gelang barcode IGD</p>
          </div>

          <!-- Formulir Registrasi Pasien Darurat -->
          <div class="max-w-[580px] bg-white rounded-2xl border border-slate-100 p-6 space-y-5 shadow-[0_1px_3px_rgba(0,0,0,0.02)]"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Root -->
  <div id="modalRoot"></div>
  <!-- Toast Notification -->
  <div id="toastRoot" class="fixed bottom-5 right-5 z-50 pointer-events-none flex flex-col gap-2"></div>

  <!-- File JavaScript Eksternal -->
  <script src="./js/icons.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/pages.js"></script>
  <script src="./js/modals.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
