<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — Care IGD Clinical Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'Inter', 'sans-serif'],
            inter: ['Inter', 'sans-serif'],
          },
          colors: {
            med: {
              DEFAULT: '#006a4e',
              dark: '#00563f',
              light: '#e6f4f0',
              emerald: '#047857',
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body data-page="dashboard">
  <!-- Root Container: Halaman Dashboard Antrean Pasien IGD -->
  <div id="appRoot">
    <div class="app-shell">
      <!-- Sidebar Navigasi Utama -->
      <aside class="sidebar">
        <div>
          <div class="flex items-center gap-3.5 px-2 mb-9 cursor-pointer" onclick="navigate('dashboard')">
            <div class="w-11 h-11 rounded-2xl bg-[#006a4e] flex items-center justify-center shadow-sm">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </div>
            <div>
              <div class="text-[18px] font-bold text-slate-900 leading-none tracking-tight">Care IGD</div>
              <div class="text-[10px] font-bold text-slate-400 tracking-[0.1em] uppercase mt-1">CLINICAL SUITE</div>
            </div>
          </div>

          <nav class="flex flex-col gap-2 nav-list-mobile">
            <button class="nav-btn active" onclick="navigate('dashboard')">
              <span class="flex items-center gap-3.5"><span>Dashboard</span></span>
            </button>
            <button class="nav-btn" onclick="navigate('pasien-igd')">
              <span class="flex items-center gap-3.5"><span>Pasien IGD</span></span>
            </button>
            <button class="nav-btn" onclick="navigate('pemesanan')">
              <span class="flex items-center gap-3.5"><span>Pemesanan</span></span>
            </button>
            <button class="nav-btn" onclick="navigate('lab-lis')">
              <span class="flex items-center gap-3.5"><span>Lab LIS</span></span>
            </button>
          </nav>
        </div>

        <div class="pt-4 border-t border-slate-100">
          <button onclick="doLogout()" class="w-full py-2.5 px-3.5 rounded-xl text-slate-500 hover:text-rose-600 hover:bg-rose-50/60 text-xs font-semibold flex items-center gap-3 transition cursor-pointer">
            <span>Logout</span>
          </button>
        </div>
      </aside>

      <!-- Area Konten Utama Dashboard -->
      <main class="main-area">
        <header class="topbar">
          <div></div>
          <div class="flex items-center gap-3">
            <div class="text-right">
              <div class="text-sm font-bold text-slate-900 leading-tight">dr. Farhan Malik, Sp.EM</div>
              <div class="text-xs font-medium text-slate-400">Dokter</div>
            </div>
            <div class="w-10 h-10 rounded-full flex items-center justify-center text-xs font-bold bg-[#0b5340] text-white">FM</div>
          </div>
        </header>

        <div class="page-body">
          <!-- Kartu Ringkasan Triase (Merah P1, Kuning P2, Hijau P3) -->
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-7">
            <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
              <div class="flex items-center justify-between mb-4">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-600">MERAH (P1)</span>
                <span class="w-3.5 h-3.5 rounded-full bg-rose-400 ring-4 ring-rose-50"></span>
              </div>
              <div class="flex items-baseline gap-1.5">
                <span class="text-3xl font-extrabold text-rose-500 tracking-tight">1</span>
                <span class="text-sm font-semibold text-slate-600">Pasien</span>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
              <div class="flex items-center justify-between mb-4">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-600">KUNING (P2)</span>
                <span class="w-3.5 h-3.5 rounded-full bg-amber-400 ring-4 ring-amber-50"></span>
              </div>
              <div class="flex items-baseline gap-1.5">
                <span class="text-3xl font-extrabold text-slate-800 tracking-tight">1</span>
                <span class="text-sm font-semibold text-slate-600">Pasien</span>
              </div>
            </div>

            <div class="bg-white rounded-2xl border border-slate-100 p-5 shadow-[0_1px_2px_rgba(0,0,0,0.03)]">
              <div class="flex items-center justify-between mb-4">
                <span class="text-[11px] font-bold uppercase tracking-wider text-slate-600">HIJAU (P3)</span>
                <span class="w-3.5 h-3.5 rounded-full bg-emerald-500 ring-4 ring-emerald-50"></span>
              </div>
              <div class="flex items-baseline gap-1.5">
                <span class="text-3xl font-extrabold text-slate-800 tracking-tight">1</span>
                <span class="text-sm font-semibold text-slate-600">Pasien</span>
              </div>
            </div>
          </div>

          <!-- Header Daftar Antrean Pasien & Tombol Registrasi -->
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
            <div>
              <h2 class="text-lg font-bold text-slate-900 tracking-tight">Daftar Antrean Pasien</h2>
              <p class="text-xs font-medium text-slate-400">Status triase dan alokasi bed saat ini</p>
            </div>
            <div class="flex items-center gap-2.5">
              <button onclick="openNewRegBiasa()" class="px-3.5 py-2 rounded-xl bg-white hover:bg-emerald-50 border border-emerald-700/30 text-[#047857] text-xs font-semibold inline-flex items-center gap-1.5 transition">
                <span>Registrasi Biasa</span>
              </button>
              <button onclick="openNewRegDarurat()" class="px-3.5 py-2 rounded-xl bg-[#e11d48] hover:bg-rose-700 text-white text-xs font-semibold inline-flex items-center gap-1.5 shadow-sm transition">
                <span>Registrasi Darurat</span>
              </button>
            </div>
          </div>

          <!-- Pencarian Pasien -->
          <div class="relative mb-4">
            <input type="text" placeholder="Cari berdasarkan No. RM, Nama Pasien, atau ID Pasien..." class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-white border border-slate-200/80 text-xs text-slate-700 placeholder-slate-400 outline-none focus:border-[#006a4e]" />
          </div>

          <!-- Daftar Kartu Antrean Pasien (Dirender dinamis oleh js/pages.js) -->
          <div class="space-y-3"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal Root -->
  <div id="modalRoot"></div>
  <!-- Toast Notification -->
  <div id="toastRoot" class="fixed bottom-5 right-5 z-50 pointer-events-none flex flex-col gap-2"></div>

  <!-- File JavaScript Eksternal -->
  <script src="./js/icons.js"></script>
  <script src="./js/state.js"></script>
  <script src="./js/pages.js"></script>
  <script src="./js/modals.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
